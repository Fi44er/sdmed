<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Подтверждение регистрации</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                line-height: 1.6;
                color: #333;
                max-width: 600px;
                margin: 0 auto;
                padding: 20px;
            }
            .container {
                background: #f9f9f9;
                border-radius: 8px;
                padding: 30px;
                text-align: center;
            }
            .code {
                font-size: 32px;
                font-weight: bold;
                color: #4caf50;
                letter-spacing: 5px;
                margin: 20px 0;
                padding: 15px;
                background: #fff;
                border-radius: 5px;
                border: 1px solid #ddd;
            }
            .footer {
                margin-top: 30px;
                font-size: 12px;
                color: #999;
            }
            h2 {
                color: #333;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>Подтверждение регистрации</h2>
            <p>Здравствуйте!</p>
            <p>
                Для завершения регистрации введите следующий код подтверждения:
            </p>
            <div class="code">{{.VerifyCode}}</div>
            <p>Код действителен в течение 10 минут.</p>
            <p>
                Если вы не регистрировались на нашем сайте, просто
                проигнорируйте это письмо.
            </p>
            <div class="footer">
                <p>© {{.Date}} Ваша компания. Все права защищены.</p>
            </div>
        </div>
    </body>
</html>
