basePath: /api/
definitions:
  auth_dto.CodeDTO:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth_dto.ResetPasswordDTO:
    properties:
      password:
        type: string
    type: object
  auth_dto.SignInDTO:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth_dto.SignUpDTO:
    properties:
      email:
        type: string
      fio:
        type: string
      password:
        type: string
      phone_number:
        type: string
    required:
    - email
    - fio
    - password
    - phone_number
    type: object
  auth_dto.VerifyCodeDTO:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  cart_dto.AddCartItemRequest:
    properties:
      dynamic_options:
        items:
          $ref: '#/definitions/cart_entity.DynamicOption'
        type: array
      iso:
        type: string
      product_id:
        type: string
      quantity:
        minimum: 1
        type: integer
    required:
    - product_id
    - quantity
    type: object
  cart_dto.CartItemResponse:
    properties:
      article:
        type: string
      id:
        type: string
      image:
        type: string
      iso:
        type: string
      name:
        type: string
      product_id:
        type: string
      quantity:
        type: integer
      selected_options:
        items:
          $ref: '#/definitions/cart_entity.SelectedOptionResponse'
        type: array
      total_price:
        type: number
      unit_price:
        type: number
    type: object
  cart_dto.CartResponse:
    properties:
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/cart_dto.CartItemResponse'
        type: array
      total_price:
        type: number
      total_qty:
        type: integer
    type: object
  cart_dto.MoveCartRequest:
    properties:
      user_id:
        type: string
    type: object
  cart_entity.DynamicOption:
    properties:
      id:
        type: string
      value:
        type: string
    type: object
  cart_entity.SelectedOptionResponse:
    properties:
      name:
        type: string
      value:
        type: string
    type: object
  dto.CreateTicketDTO:
    properties:
      first_message:
        type: string
      priority:
        maximum: 3
        minimum: 1
        type: integer
      subject:
        type: string
    required:
    - first_message
    - priority
    - subject
    type: object
  dto.SendMessageDTO:
    properties:
      payload:
        type: string
    required:
    - payload
    type: object
  order_dto.ChangeOrderStatusRequest:
    properties:
      order_id:
        type: string
      status:
        $ref: '#/definitions/order_entity.OrderStatus'
    required:
    - order_id
    - status
    type: object
  order_dto.CreateDirectOrderRequest:
    properties:
      address:
        type: string
      email:
        type: string
      fio:
        type: string
      phone_number:
        type: string
      product_id:
        type: string
    required:
    - address
    - email
    - fio
    - phone_number
    - product_id
    type: object
  order_dto.CreateOrderRequest:
    properties:
      address:
        type: string
      email:
        type: string
      fio:
        type: string
      phone_number:
        type: string
    required:
    - address
    - email
    - fio
    - phone_number
    type: object
  order_entity.Order:
    properties:
      address:
        type: string
      createdAt:
        type: string
      email:
        type: string
      fio:
        type: string
      fragmentLink:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/order_entity.OrderItem'
        type: array
      phone:
        type: string
      status:
        $ref: '#/definitions/order_entity.OrderStatus'
      totalPrice:
        type: number
      updatedAt:
        type: string
      userID:
        type: string
    type: object
  order_entity.OrderItem:
    properties:
      article:
        type: string
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      orderID:
        type: string
      price:
        type: number
      productID:
        type: string
      quantity:
        type: integer
      selectedOptions:
        description: JSON data
      totalPrice:
        type: number
      updatedAt:
        type: string
    type: object
  order_entity.OrderStatus:
    enum:
    - pending
    - paid
    - cancelled
    - refunded
    - shipping
    - completed
    type: string
    x-enum-varnames:
    - OrderStatusPending
    - OrderStatusPaid
    - OrderStatusCancelled
    - OrderStatusRefunded
    - OrderStatusShpping
    - OrderStatusCompleted
  product_dto.CategoryResponse:
    properties:
      characteristics:
        items:
          $ref: '#/definitions/product_dto.CharacteristicResponse'
        type: array
      created_at:
        type: string
      id:
        type: string
      images:
        items:
          $ref: '#/definitions/product_dto.FileResponse'
        type: array
      name:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  product_dto.CharOption:
    properties:
      id:
        type: string
      value:
        type: string
    type: object
  product_dto.CharValueRequest:
    properties:
      characteristic_id:
        type: string
      value:
        type: string
    required:
    - characteristic_id
    type: object
  product_dto.CharacteristicResponse:
    properties:
      data_type:
        type: string
      description:
        type: string
      id:
        type: string
      is_required:
        type: boolean
      name:
        type: string
      options:
        items:
          $ref: '#/definitions/product_dto.CharOption'
        type: array
      unit:
        type: string
    type: object
  product_dto.CreateCategoryRequest:
    properties:
      characteristics:
        items:
          $ref: '#/definitions/product_dto.CreateCharacteristicRequest'
        type: array
      images:
        items:
          type: string
        minItems: 1
        type: array
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - images
    - name
    type: object
  product_dto.CreateCharacteristicRequest:
    properties:
      data_type:
        type: string
      description:
        maxLength: 255
        minLength: 1
        type: string
      is_required:
        type: boolean
      name:
        maxLength: 255
        minLength: 1
        type: string
      options:
        items:
          type: string
        type: array
      unit:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - data_type
    - name
    type: object
  product_dto.CreateProductRequest:
    properties:
      article:
        maxLength: 100
        minLength: 2
        type: string
      category_id:
        type: string
      characteristic_values:
        items:
          $ref: '#/definitions/product_dto.CharValueRequest'
        type: array
      description:
        maxLength: 5000
        minLength: 2
        type: string
      images:
        items:
          type: string
        minItems: 1
        type: array
      is_active:
        type: boolean
      manual_price:
        minimum: 0
        type: number
      name:
        maxLength: 100
        minLength: 2
        type: string
      tru_code_id:
        type: string
    required:
    - article
    - images
    - is_active
    - name
    type: object
  product_dto.FileResponse:
    properties:
      id:
        type: string
      name:
        type: string
      url:
        type: string
    type: object
  product_dto.UpdateCategoryRequest:
    properties:
      characteristics:
        items:
          $ref: '#/definitions/product_dto.CreateCharacteristicRequest'
        type: array
      id:
        maxLength: 255
        minLength: 1
        type: string
      images:
        items:
          type: string
        type: array
      name:
        maxLength: 255
        minLength: 1
        type: string
    type: object
  response.Response:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
  response.ResponseData:
    properties:
      data: {}
      status:
        example: success
        type: string
    type: object
  response.ResponseListData:
    properties:
      data:
        items: {}
        type: array
      status:
        type: string
    type: object
  scraper_dto.UpdateSettingsDTO:
    properties:
      interval_ms:
        minimum: 500
        type: integer
      max_goroutines:
        maximum: 10
        minimum: 1
        type: integer
      max_retries:
        maximum: 10
        minimum: 1
        type: integer
      pause_s:
        minimum: 1
        type: integer
      retry_delay_s:
        minimum: 1
        type: integer
      timeout_s:
        minimum: 1
        type: integer
    required:
    - interval_ms
    - max_goroutines
    - max_retries
    - pause_s
    - retry_delay_s
    - timeout_s
    type: object
  scraper_http.ScraperStatusResponse:
    properties:
      completed_tasks:
        type: integer
      is_running:
        type: boolean
      message:
        type: string
      percent:
        type: number
      total_tasks:
        type: integer
    type: object
  scraper_http.StartScraperRequest:
    properties:
      articles:
        example:
        - 06-01-01
        items:
          type: string
        type: array
      categories:
        example:
        - "06"
        - "07"
        items:
          type: string
        type: array
      regions:
        example:
        - "77"
        - "78"
        items:
          type: string
        type: array
    type: object
  user_dto.UserDTO:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      patronymic:
        type: string
      phone_number:
        type: string
      surname:
        type: string
    type: object
  user_dto.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      patronymic:
        type: string
      phone_number:
        type: string
      role:
        items:
          type: string
        type: array
      surname:
        type: string
    type: object
host: 127.0.0.1:8080
info:
  contact: {}
  description: Swagger docs from sdmedik backend
  title: sdmedik API
  version: "1.0"
paths:
  /auth/devices:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: GetDevices
      tags:
      - Auth
  /auth/devices/{device_id}/revoke:
    post:
      consumes:
      - application/json
      parameters:
      - description: Device ID
        in: path
        name: device_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: RevokeDevice
      tags:
      - Auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Forgot Password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth_dto.CodeDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: ForgotPassword
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - CsrfToken: []
      summary: RefreshSession
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Reset password token
        in: query
        name: token
        required: true
        type: string
      - description: Reset Password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth_dto.ResetPasswordDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: ResetPassword
      tags:
      - Auth
  /auth/send-code:
    post:
      consumes:
      - application/json
      parameters:
      - description: Send Code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth_dto.CodeDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: SendCode
      tags:
      - Auth
  /auth/sign-in:
    post:
      consumes:
      - application/json
      parameters:
      - description: Sign In
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth_dto.SignInDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: SignIn
      tags:
      - Auth
  /auth/sign-out:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: SignOut
      tags:
      - Auth
  /auth/sign-out-all:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: SignOutAll
      tags:
      - Auth
  /auth/sign-up:
    post:
      consumes:
      - application/json
      parameters:
      - description: Sign Up
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth_dto.SignUpDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: SignUp
      tags:
      - Auth
  /auth/validate-reset-password:
    get:
      consumes:
      - application/json
      parameters:
      - description: Validate Reset password token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: ValidateResetPassword
      tags:
      - Auth
  /auth/verify-code:
    post:
      consumes:
      - application/json
      parameters:
      - description: Verify Code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth_dto.VerifyCodeDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: VerifyCode
      tags:
      - Auth
  /cart:
    get:
      consumes:
      - application/json
      description: Get cart for current user or session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cart_dto.CartResponse'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get cart
      tags:
      - cart
  /cart/items:
    post:
      consumes:
      - application/json
      description: Add item to cart for current user or session
      parameters:
      - description: Cart Item
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/cart_dto.AddCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cart_dto.CartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Add item to cart
      tags:
      - cart
  /cart/items/{id}:
    delete:
      consumes:
      - application/json
      description: Delete item from cart for current user or session
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cart_dto.CartResponse'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Delete item from cart
      tags:
      - cart
  /cart/move:
    post:
      consumes:
      - application/json
      description: Move session cart to user after login
      parameters:
      - description: Move Data
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/cart_dto.MoveCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Move session cart to user
      tags:
      - cart
  /categories:
    get:
      consumes:
      - application/json
      description: Get list of categories with pagination
      parameters:
      - default: 0
        description: Page for pagination
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size for pagination
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/product_dto.CategoryResponse'
                  type: array
              type: object
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get all categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a new category
      parameters:
      - description: Category
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/product_dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Create a new category
      tags:
      - categories
  /categories/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a category by ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Delete category
      tags:
      - categories
    get:
      consumes:
      - application/json
      description: Get a single category by its ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/product_dto.CategoryResponse'
              type: object
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get category by ID
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: |-
        Update a category
        ### Особенности обновления характеристик:
        **Важно:** При обновлении категории поле `Characteristics` работает по принципу полной замены.
        1. **Добавление новых характеристик:**
        Укажите все существующие характеристики + новые
        2. **Удаление характеристик:**
        Укажите только те характеристики, которые должны остаться
        3. **Изменение характеристик:**
        Укажите обновленный список всех характеристик
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Category
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/product_dto.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Update a category
      tags:
      - categories
  /categories/by-slug/{slug}:
    get:
      consumes:
      - application/json
      description: Get a single category by its slug
      parameters:
      - description: Category slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/product_dto.CategoryResponse'
              type: object
        "500":
          description: Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get category by slug
      tags:
      - categories
  /chat/messages/{id}/read:
    post:
      consumes:
      - application/json
      description: Mark a specific message as read by the current user
      parameters:
      - description: Message ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Mark message as read
      tags:
      - messages
  /chat/tickets:
    get:
      consumes:
      - application/json
      description: Get all tickets with pagination (admin and manager only)
      parameters:
      - default: 1
        description: Page number
        in: query
